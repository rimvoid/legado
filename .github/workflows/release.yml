name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Unsigned Release Apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          chmod +x gradlew
          ./gradlew assembleRelease -PVERSION_NAME="$VERSION" --build-cache --parallel --stacktrace

      - name: Organize the Files
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          cp -f ${{ github.workspace }}/app/build/outputs/apk/release/*.apk ${{ github.workspace }}/apk/

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v7
        with:
          name: legado_app_${{ env.VERSION }}
          path: ${{ github.workspace }}/apk/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: legado_app_${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ github.workspace }}/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
